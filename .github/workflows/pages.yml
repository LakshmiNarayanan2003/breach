name: Validate and deploy BREACH
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: breach-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            playwright-report/
            artifacts/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  mobile-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: xvfb-run -a npx playwright test --config=playwright.browsers.config.ts --project=${{ matrix.browser }} --headed
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
            artifacts/mobile-*.png
  deploy:
    if: github.event_name != 'pull_request'
    needs: [validate, mobile-browsers]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy production site
        id: deployment
        uses: actions/deploy-pages@v4
